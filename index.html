<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B0710" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F4FB" media="(prefers-color-scheme: light)" />

    <!-- Applies the stored theme before first paint so light-mode users never
         see a flash of the dark default. Mirrors src/hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pero-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage blocked — dark default is already correct */
        }
      })();
    </script>
